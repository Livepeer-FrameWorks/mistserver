# Local hooks for formatting. Pre-commit checks the staged C/C++ lines.
# Pre-push runs the same changed-line diff gate as .github/workflows/lint.yml
# so CI doesn't catch what could've been caught locally.
#
# Setup (one-time, per clone):
#   brew install lefthook         # macOS
#   apt install lefthook          # Debian/Ubuntu
#   lefthook install              # writes .git/hooks/* in this repo
#
# Bypass for a single commit if absolutely needed:
#   LEFTHOOK=0 git commit ...
#
# Both hooks format with clang-format 21, the version CI installs; other versions
# format some constructs differently. scripts/clang-format-21.sh finds one
# (clang-format-21 or a clang-format 21 on PATH, else clang-format==21.1.8 through
# pipx) and fails with a hint when there is none.

pre-commit:
  parallel: true
  commands:
    clang-format:
      tags: format
      # Only run on tracked C/C++ sources, exclude vendored/generated trees.
      glob: "*.{cpp,h,hpp}"
      exclude:
        - "lsp/**"
        - "embed/**"
        - "subprojects/**"
        - "**/*.js.h"
        - "**/*.css.h"
      # Checks the staged content (the index), confined to its semantic changed
      # lines, and never writes files. Formatting in place with stage_fixed is
      # unsafe: lefthook then hides a partially staged file's unstaged hunks
      # while the command runs and re-applies them afterwards, at shifted lines
      # whenever the command changed the file.
      run: |
        binary="$(scripts/clang-format-21.sh)" || exit 1
        python3 scripts/format-changed-lines.py --binary "$binary" --staged
      fail_text: |
        The staged C/C++ lines above are not clang-format 21 clean. Stage each listed file completely, then run
          python3 scripts/format-changed-lines.py --binary "$(scripts/clang-format-21.sh)" --staged --apply
        and stage the result.

pre-push:
  parallel: true
  commands:
    clang-format:
      tags: format
      run: |
        binary="$(scripts/clang-format-21.sh)" || exit 1
        base="${LEFTHOOK_FORMAT_BASE:-}"
        if [ -z "$base" ]; then
          branch="$(git symbolic-ref -q HEAD)"
          upstream="$(git for-each-ref --format='%(upstream:short)' "$branch")"
          if [ -n "$upstream" ]; then
            base="$(git merge-base HEAD "$upstream")"
          else
            base="HEAD~1"
          fi
        fi

        python3 scripts/format-changed-lines.py --binary "$binary" "$base" HEAD
