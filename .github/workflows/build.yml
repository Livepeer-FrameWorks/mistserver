name: Build MistServer

on:
  push:
    tags:
      - 'v*'
      - 'frameworks-*'
  workflow_dispatch:
    inputs:
      publish:
        description: Push Docker images and manifests
        required: true
        type: boolean
        default: false
      sign_macos:
        description: Sign and notarize the macOS artifact
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  REGISTRY_GHCR: ghcr.io/livepeer-frameworks
  REGISTRY_DOCKERHUB: livepeerframeworks
  DAV1D_REF: 1.5.3
  SVT_AV1_REF: v3.1.2

jobs:
  # Linux accelerator images are built on ordinary GitHub-hosted CPU runners. The
  # vendor SDK images provide compilers and userspace runtimes; physical hardware is
  # only needed by the separately opt-in execution tests.
  build-onnx-accelerators:
    name: Build Linux ONNX accelerator images and native bundles
    uses: ./.github/workflows/onnx-accelerators.yml
    with:
      profile: all
      publish: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
      run_hardware_tests: false
    secrets: inherit
    permissions:
      contents: read
      packages: write

  # ---------------------------------------------------------------------------
  # Docker image — linux/amd64 on ubuntu
  # ---------------------------------------------------------------------------
  build-image-amd64:
    name: Build Docker Image (linux/amd64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get version info
        id: version
        run: |
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=development-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to DockerHub
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (amd64)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.mistserver-onnx
          platforms: linux/amd64
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
          load: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
          # The local Docker exporter used by non-publishing validation cannot
          # load the attested manifest list that provenance/SBOM generation creates.
          provenance: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
          sbom: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
          build-args: |
            ONNX_PROFILE=cpu
            ONNX_STATIC=false
            ONNX_RUNTIME_DISTRIBUTION=onnxruntime-linux-x64
          tags: |
            ${{ env.REGISTRY_GHCR }}/mistserver:${{ steps.version.outputs.tag }}-amd64
            ${{ env.REGISTRY_DOCKERHUB }}/mistserver:${{ steps.version.outputs.tag }}-amd64
          cache-from: |
            type=gha,scope=mistserver-amd64
            type=registry,ref=${{ env.REGISTRY_GHCR }}/mistserver:latest
          cache-to: type=gha,mode=max,ignore-error=true,scope=mistserver-amd64

      - name: Pull published image for verification
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        run: docker pull '${{ env.REGISTRY_GHCR }}/mistserver:${{ steps.version.outputs.tag }}-amd64'

      - name: Verify ONNX capability in image
        env:
          IMAGE: ${{ env.REGISTRY_GHCR }}/mistserver:${{ steps.version.outputs.tag }}-amd64
        run: |
          capability=$(docker run --rm --entrypoint MistProcONNX "$IMAGE" -j 2>/dev/null || true)
          printf '%s' "$capability" | grep -F "This binary packages the 'cpu' profile"

      - name: Save digest
        run: |
          mkdir -p release-metadata
          echo "${{ steps.build.outputs.digest }}" > release-metadata/docker-digest-amd64.txt
          echo "${{ steps.version.outputs.tag }}" > release-metadata/docker-tag.txt

      - name: Upload metadata
        uses: actions/upload-artifact@v7
        with:
          name: docker-metadata-amd64
          path: release-metadata/docker-digest-amd64.txt

  # ---------------------------------------------------------------------------
  # Docker image — linux/arm64 on GitHub-hosted native ARM runner
  # ---------------------------------------------------------------------------
  build-image-arm64:
    name: Build Docker Image (linux/arm64)
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get version info
        id: version
        run: |
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=development-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to DockerHub
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (arm64)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.mistserver-onnx
          platforms: linux/arm64
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
          load: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
          provenance: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
          sbom: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
          build-args: |
            ONNX_PROFILE=cpu
            ONNX_STATIC=false
            ONNX_RUNTIME_DISTRIBUTION=onnxruntime-linux-aarch64
          tags: |
            ${{ env.REGISTRY_GHCR }}/mistserver:${{ steps.version.outputs.tag }}-arm64
            ${{ env.REGISTRY_DOCKERHUB }}/mistserver:${{ steps.version.outputs.tag }}-arm64
          cache-from: |
            type=gha,scope=mistserver-arm64
          cache-to: type=gha,mode=max,ignore-error=true,scope=mistserver-arm64

      - name: Pull published image for verification
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        run: docker pull '${{ env.REGISTRY_GHCR }}/mistserver:${{ steps.version.outputs.tag }}-arm64'

      - name: Verify ONNX capability in image
        env:
          IMAGE: ${{ env.REGISTRY_GHCR }}/mistserver:${{ steps.version.outputs.tag }}-arm64
        run: |
          capability=$(docker run --rm --entrypoint MistProcONNX "$IMAGE" -j 2>/dev/null || true)
          printf '%s' "$capability" | grep -F "This binary packages the 'cpu' profile"

      - name: Save digest
        run: |
          mkdir -p release-metadata
          echo "${{ steps.build.outputs.digest }}" > release-metadata/docker-digest-arm64.txt

      - name: Upload metadata
        uses: actions/upload-artifact@v7
        with:
          name: docker-metadata-arm64
          path: release-metadata/*.txt

  # ---------------------------------------------------------------------------
  # Multi-arch Docker manifest — combine amd64 + arm64 images
  # ---------------------------------------------------------------------------
  create-manifest:
    name: Create Multi-arch Docker Manifest
    needs: [build-image-amd64, build-image-arm64]
    if: github.event_name != 'workflow_dispatch' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Get version info
        id: version
        run: |
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=development-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create and push multi-arch manifests
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"

          # GHCR manifests
          docker buildx imagetools create \
            -t ${{ env.REGISTRY_GHCR }}/mistserver:${TAG} \
            ${{ env.REGISTRY_GHCR }}/mistserver:${TAG}-amd64 \
            ${{ env.REGISTRY_GHCR }}/mistserver:${TAG}-arm64

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            docker buildx imagetools create \
              -t ${{ env.REGISTRY_GHCR }}/mistserver:latest \
              ${{ env.REGISTRY_GHCR }}/mistserver:${TAG}-amd64 \
              ${{ env.REGISTRY_GHCR }}/mistserver:${TAG}-arm64
          fi

          # DockerHub manifests
          docker buildx imagetools create \
            -t ${{ env.REGISTRY_DOCKERHUB }}/mistserver:${TAG} \
            ${{ env.REGISTRY_DOCKERHUB }}/mistserver:${TAG}-amd64 \
            ${{ env.REGISTRY_DOCKERHUB }}/mistserver:${TAG}-arm64

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            docker buildx imagetools create \
              -t ${{ env.REGISTRY_DOCKERHUB }}/mistserver:latest \
              ${{ env.REGISTRY_DOCKERHUB }}/mistserver:${TAG}-amd64 \
              ${{ env.REGISTRY_DOCKERHUB }}/mistserver:${TAG}-arm64
          fi

      - name: Save Docker metadata
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          mkdir -p release-metadata
          echo "${TAG}" > release-metadata/docker-tag.txt

      - name: Upload Docker metadata
        uses: actions/upload-artifact@v7
        with:
          name: docker-metadata
          path: release-metadata/*.txt

  # ---------------------------------------------------------------------------
  # Native binary — linux/amd64 on ubuntu
  # ---------------------------------------------------------------------------
  build-binaries-amd64:
    name: Build Native Binaries (linux/amd64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get version info
        id: version
        run: |
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=development-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git python3 python3-pip ninja-build pkg-config nasm yasm cmake \
            libmbedtls-dev libcjson-dev zlib1g-dev liblzma-dev libxml2-dev libmp3lame-dev \
            libopus-dev libvpx-dev libx265-dev libnuma-dev libaom-dev \
            libjpeg-dev libpng-dev ffmpeg
          python3 -m pip install --break-system-packages 'meson>=1.6.0' 'cmake>=3.28'

      - uses: ./.github/actions/setup-onnx-dependencies
        with:
          profile: cpu
          prefix: ${{ github.workspace }}/.deps/onnx/cpu
          work-dir: ${{ runner.temp }}/onnx-build/cpu
          runtime-distribution: onnxruntime-linux-x64

      - name: Build static dav1d
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${DAV1D_REF}" https://code.videolan.org/videolan/dav1d.git /tmp/dav1d-src
          meson setup /tmp/dav1d-build /tmp/dav1d-src \
            --default-library=static \
            --prefix=/tmp/dav1d-static \
            --libdir=lib \
            --buildtype=release \
            -Denable_tools=false \
            -Denable_tests=false
          meson compile -C /tmp/dav1d-build
          meson install -C /tmp/dav1d-build
          PKG_CONFIG_PATH=/tmp/dav1d-static/lib/pkgconfig pkg-config --exists dav1d

      - name: Build static SVT-AV1
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${SVT_AV1_REF}" https://gitlab.com/AOMediaCodec/SVT-AV1.git /tmp/svt-av1-src
          cmake -S /tmp/svt-av1-src -B /tmp/svt-av1-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/tmp/svt-av1-static \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_APPS=OFF \
            -DBUILD_TESTING=OFF \
            -DNATIVE=OFF
          cmake --build /tmp/svt-av1-build
          cmake --install /tmp/svt-av1-build
          test -n "$(find /tmp/svt-av1-static -path '*/pkgconfig/SvtAv1Enc.pc' -print -quit)"

      - name: Build MistServer
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/.deps/onnx/cpu/lib/pkgconfig:/tmp/dav1d-static/lib/pkgconfig:/tmp/dav1d-static/lib64/pkgconfig:/tmp/svt-av1-static/lib/pkgconfig:/tmp/svt-av1-static/lib64/pkgconfig
          CMAKE_PREFIX_PATH: ${{ github.workspace }}/.deps/onnx/cpu
        run: |
          # MbedTLS is intentionally not forced: the top-level find_library and
          # nested libsrtp dependency must resolve the same implementation.
          meson setup build \
            --default-library=static \
            --wrap-mode=default \
            --prefer-static \
            --force-fallback-for=usrsctp,libavcodec,libavfilter,libavformat,libavutil,libswscale,libswresample,x264 \
            -DWITH_AV=true \
            -DONNX=enabled \
            -DONNX_STATIC=false \
            -DONNX_PROFILE=cpu \
            -DDEBUG=3 \
            -DNORIST=true \
            -DRELEASE=Generic_x86_64 \
            --prefix=/tmp/mistserver-install
          # Assert NDI/ONVIF support compiled in (static libxml2 present in this env).
          grep -qE 'NDI:[[:space:]]+COMPILED' build/meson-logs/meson-log.txt || { echo "::error::NDI support was not compiled"; exit 1; }
          grep -qE 'ONVIF camera discovery:[[:space:]]+YES' build/meson-logs/meson-log.txt || { echo "::error::ONVIF support was not built"; exit 1; }
          grep -qE 'ONNX AI processing:[[:space:]]+YES \(profile=cpu\)' build/meson-logs/meson-log.txt || { echo "::error::ONNX CPU support was not built"; exit 1; }
          ninja -C build
          meson test -C build "Pinned FFmpeg codec registry contract" --print-errorlogs
          scripts/ONNX/prepare_models.sh --dir "$RUNNER_TEMP/onnx-models" yolo26n
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i testsrc2=size=640x640 -frames:v 1 "$RUNNER_TEMP/onnx-test.jpg"
          scripts/ONNX/verify_release.sh --build-dir build --allow-shared \
            --expected-profile cpu --provider cpu \
            --model "$RUNNER_TEMP/onnx-models/yolo26n.onnx" \
            --image "$RUNNER_TEMP/onnx-test.jpg"
          ninja -C build install
          cp -a '${{ github.workspace }}/.deps/onnx/cpu/lib/'*.so* \
            /tmp/mistserver-install/lib/
          patchelf --set-rpath '$ORIGIN/../lib:$ORIGIN/../lib/x86_64-linux-gnu' \
            /tmp/mistserver-install/bin/MistProcONNX
          find /tmp/mistserver-install/lib -type f -name '*.so*' -exec \
            patchelf --set-rpath '$ORIGIN:$ORIGIN/..' {} \;
          capability=$(/tmp/mistserver-install/bin/MistProcONNX -j 2>/dev/null || true)
          printf '%s' "$capability" | grep -F "This binary packages the 'cpu' profile"

      - name: Verify native runtime dependencies
        run: |
          set -euo pipefail
          failed=0
          for bin in /tmp/mistserver-install/bin/Mist*; do
            [ -x "$bin" ] || continue
            name="$(basename "$bin")"
            log="/tmp/needed-${name}.txt"
            echo "::group::runtime deps ${name}"
            objdump -p "$bin" | awk '/NEEDED/ {print $2}' | tee "$log"
            echo "::endgroup::"
            if ldd "$bin" | grep -F 'not found'; then
              echo "Unresolved runtime dependency in ${name}" >&2
              failed=1
            fi
            while IFS= read -r dependency; do
              case "$dependency" in
                ld-linux-x86-64.so.*|libc.so.6|libm.so.6|libgcc_s.so.1|libstdc++.so.6) ;;
                *)
                  if ! find /tmp/mistserver-install/lib -name "$dependency" -print -quit | grep -q .; then
                    echo "Unpackaged runtime dependency in ${name}: ${dependency}" >&2
                    failed=1
                  fi
                  ;;
              esac
            done < "$log"
          done
          if [ "$failed" -ne 0 ]; then
            echo "Native artifact has non-system runtime dependencies" >&2
            exit 1
          fi

      - name: Extract debug symbols
        run: |
          set -euo pipefail
          mkdir -p /tmp/mistserver-debug/bin
          for bin in /tmp/mistserver-install/bin/Mist*; do
            [ -x "$bin" ] || continue
            name="$(basename "$bin")"
            objcopy --only-keep-debug "$bin" "/tmp/mistserver-debug/bin/${name}.debug"
            objcopy --strip-debug --strip-unneeded "$bin"
            objcopy --add-gnu-debuglink="/tmp/mistserver-debug/bin/${name}.debug" "$bin"
          done

      - name: Package binaries
        run: |
          cd /tmp/mistserver-install
          mkdir -p share/mistserver/onnx share/licenses
          cp -a '${{ github.workspace }}/.deps/onnx/cpu/share/licenses/.' share/licenses/
          cp '${{ github.workspace }}/scripts/ONNX/prepare_models.sh' \
             '${{ github.workspace }}/scripts/ONNX/models.manifest.tsv' \
             '${{ github.workspace }}/scripts/ONNX/dependencies.lock.tsv' \
             '${{ github.workspace }}/scripts/ONNX/accelerator-images.json' \
             '${{ github.workspace }}/scripts/ONNX/RELEASE_CHECKLIST.md' \
             share/mistserver/onnx/
          tar czf ${{ github.workspace }}/mistserver-linux-amd64-${{ steps.version.outputs.tag }}.tar.gz bin/ lib/ share/

      - name: Package debug symbols
        run: |
          cd /tmp/mistserver-debug
          tar czf ${{ github.workspace }}/mistserver-linux-amd64-debug-${{ steps.version.outputs.tag }}.tar.gz bin/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mistserver-linux-amd64
          path: mistserver-linux-amd64-${{ steps.version.outputs.tag }}.tar.gz
          compression-level: 0

      - name: Upload debug symbols
        uses: actions/upload-artifact@v7
        with:
          name: mistserver-linux-amd64-debug
          path: mistserver-linux-amd64-debug-${{ steps.version.outputs.tag }}.tar.gz
          compression-level: 0

  # ---------------------------------------------------------------------------
  # Native binary — linux/arm64 on GitHub-hosted native ARM runner
  # ---------------------------------------------------------------------------
  build-binaries-arm64:
    name: Build Native Binaries (linux/arm64)
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get version info
        id: version
        run: |
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=development-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git python3 python3-pip ninja-build pkg-config nasm yasm cmake \
            libmbedtls-dev libcjson-dev zlib1g-dev liblzma-dev libxml2-dev libmp3lame-dev \
            libopus-dev libvpx-dev libx265-dev libnuma-dev libaom-dev \
            libjpeg-dev libpng-dev ffmpeg patchelf
          python3 -m pip install --break-system-packages 'meson>=1.6.0' 'cmake>=3.28'

      - uses: ./.github/actions/setup-onnx-dependencies
        with:
          profile: cpu
          prefix: ${{ github.workspace }}/.deps/onnx/cpu
          work-dir: ${{ runner.temp }}/onnx-build/cpu
          runtime-distribution: onnxruntime-linux-aarch64

      - name: Build static dav1d
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${DAV1D_REF}" https://code.videolan.org/videolan/dav1d.git /tmp/dav1d-src
          meson setup /tmp/dav1d-build /tmp/dav1d-src \
            --default-library=static \
            --prefix=/tmp/dav1d-static \
            --libdir=lib \
            --buildtype=release \
            -Denable_tools=false \
            -Denable_tests=false
          meson compile -C /tmp/dav1d-build
          meson install -C /tmp/dav1d-build
          PKG_CONFIG_PATH=/tmp/dav1d-static/lib/pkgconfig pkg-config --exists dav1d

      - name: Build static SVT-AV1
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${SVT_AV1_REF}" https://gitlab.com/AOMediaCodec/SVT-AV1.git /tmp/svt-av1-src
          cmake -S /tmp/svt-av1-src -B /tmp/svt-av1-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/tmp/svt-av1-static \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_APPS=OFF \
            -DBUILD_TESTING=OFF \
            -DNATIVE=OFF
          cmake --build /tmp/svt-av1-build
          cmake --install /tmp/svt-av1-build
          test -n "$(find /tmp/svt-av1-static -path '*/pkgconfig/SvtAv1Enc.pc' -print -quit)"

      - name: Build MistServer
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/.deps/onnx/cpu/lib/pkgconfig:/tmp/dav1d-static/lib/pkgconfig:/tmp/dav1d-static/lib64/pkgconfig:/tmp/svt-av1-static/lib/pkgconfig:/tmp/svt-av1-static/lib64/pkgconfig
          CMAKE_PREFIX_PATH: ${{ github.workspace }}/.deps/onnx/cpu
        run: |
          # MbedTLS is intentionally not forced: the top-level find_library and
          # nested libsrtp dependency must resolve the same implementation.
          meson setup build \
            --default-library=static \
            --wrap-mode=default \
            --prefer-static \
            --force-fallback-for=usrsctp,libavcodec,libavfilter,libavformat,libavutil,libswscale,libswresample,x264 \
            -DWITH_AV=true \
            -DONNX=enabled \
            -DONNX_STATIC=false \
            -DONNX_PROFILE=cpu \
            -DDEBUG=3 \
            -DNORIST=true \
            -DRELEASE=Generic_aarch64 \
            --prefix=/tmp/mistserver-install
          # Assert NDI/ONVIF support compiled in (static libxml2 present in this env).
          grep -qE 'NDI:[[:space:]]+COMPILED' build/meson-logs/meson-log.txt || { echo "::error::NDI support was not compiled"; exit 1; }
          grep -qE 'ONVIF camera discovery:[[:space:]]+YES' build/meson-logs/meson-log.txt || { echo "::error::ONVIF support was not built"; exit 1; }
          grep -qE 'ONNX AI processing:[[:space:]]+YES \(profile=cpu\)' build/meson-logs/meson-log.txt || { echo "::error::ONNX CPU support was not built"; exit 1; }
          ninja -C build
          meson test -C build "Pinned FFmpeg codec registry contract" --print-errorlogs
          scripts/ONNX/prepare_models.sh --dir "$RUNNER_TEMP/onnx-models" yolo26n
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i testsrc2=size=640x640 -frames:v 1 "$RUNNER_TEMP/onnx-test.jpg"
          scripts/ONNX/verify_release.sh --build-dir build --allow-shared \
            --expected-profile cpu --provider cpu \
            --model "$RUNNER_TEMP/onnx-models/yolo26n.onnx" \
            --image "$RUNNER_TEMP/onnx-test.jpg"
          ninja -C build install
          cp -a '${{ github.workspace }}/.deps/onnx/cpu/lib/'*.so* \
            /tmp/mistserver-install/lib/
          patchelf --set-rpath '$ORIGIN/../lib:$ORIGIN/../lib/aarch64-linux-gnu' \
            /tmp/mistserver-install/bin/MistProcONNX
          find /tmp/mistserver-install/lib -type f -name '*.so*' -exec \
            patchelf --set-rpath '$ORIGIN:$ORIGIN/..' {} \;
          capability=$(/tmp/mistserver-install/bin/MistProcONNX -j 2>/dev/null || true)
          printf '%s' "$capability" | grep -F "This binary packages the 'cpu' profile"

      - name: Verify native runtime dependencies
        run: |
          set -euo pipefail
          failed=0
          for bin in /tmp/mistserver-install/bin/Mist*; do
            [ -x "$bin" ] || continue
            name="$(basename "$bin")"
            log="/tmp/needed-${name}.txt"
            echo "::group::runtime deps ${name}"
            objdump -p "$bin" | awk '/NEEDED/ {print $2}' | tee "$log"
            if ldd "$bin" | grep -F 'not found'; then
              echo "Unresolved runtime dependency in ${name}" >&2
              failed=1
            fi
            echo "::endgroup::"
            while IFS= read -r dependency; do
              case "$dependency" in
                ld-linux-aarch64.so.*|libc.so.6|libm.so.6|libgcc_s.so.1|libstdc++.so.6) ;;
                *)
                  if ! find /tmp/mistserver-install/lib -name "$dependency" -print -quit | grep -q .; then
                    echo "Unpackaged runtime dependency in ${name}: ${dependency}" >&2
                    failed=1
                  fi
                  ;;
              esac
            done < "$log"
          done
          if [ "$failed" -ne 0 ]; then
            echo "Native artifact has non-system runtime dependencies" >&2
            exit 1
          fi

      - name: Extract debug symbols
        run: |
          set -euo pipefail
          mkdir -p /tmp/mistserver-debug/bin
          for bin in /tmp/mistserver-install/bin/Mist*; do
            [ -x "$bin" ] || continue
            name="$(basename "$bin")"
            objcopy --only-keep-debug "$bin" "/tmp/mistserver-debug/bin/${name}.debug"
            objcopy --strip-debug --strip-unneeded "$bin"
            objcopy --add-gnu-debuglink="/tmp/mistserver-debug/bin/${name}.debug" "$bin"
          done

      - name: Package binaries
        run: |
          cd /tmp/mistserver-install
          mkdir -p share/mistserver/onnx share/licenses
          cp -a '${{ github.workspace }}/.deps/onnx/cpu/share/licenses/.' share/licenses/
          cp '${{ github.workspace }}/scripts/ONNX/prepare_models.sh' \
             '${{ github.workspace }}/scripts/ONNX/models.manifest.tsv' \
             '${{ github.workspace }}/scripts/ONNX/dependencies.lock.tsv' \
             '${{ github.workspace }}/scripts/ONNX/accelerator-images.json' \
             '${{ github.workspace }}/scripts/ONNX/RELEASE_CHECKLIST.md' \
             share/mistserver/onnx/
          tar czf ${{ github.workspace }}/mistserver-linux-arm64-${{ steps.version.outputs.tag }}.tar.gz bin/ lib/ share/

      - name: Package debug symbols
        run: |
          cd /tmp/mistserver-debug
          tar czf ${{ github.workspace }}/mistserver-linux-arm64-debug-${{ steps.version.outputs.tag }}.tar.gz bin/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mistserver-linux-arm64
          path: mistserver-linux-arm64-${{ steps.version.outputs.tag }}.tar.gz
          compression-level: 0

      - name: Upload debug symbols
        uses: actions/upload-artifact@v7
        with:
          name: mistserver-linux-arm64-debug
          path: mistserver-linux-arm64-debug-${{ steps.version.outputs.tag }}.tar.gz
          compression-level: 0

  # ---------------------------------------------------------------------------
  # Native CoreML binary — darwin/arm64 on self-hosted Mac
  # ---------------------------------------------------------------------------
  build-binaries-darwin:
    name: Build Native CoreML Binaries (darwin/arm64)
    runs-on: macos-arm64-self-hosted
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Add Homebrew to PATH
        run: echo "/opt/homebrew/bin" >> "$GITHUB_PATH"

      - name: Get version info
        id: version
        run: |
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=development-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install macOS build dependencies
        run: brew install meson ninja pkg-config ffmpeg srt srtp cmake libxml2 jq

      - name: Restore locked CoreML dependencies
        uses: ./.github/actions/setup-onnx-dependencies
        with:
          profile: coreml
          prefix: ${{ github.workspace }}/.deps/onnx/coreml
          work-dir: ${{ runner.temp }}/onnx-build/coreml
          runtime-distribution: onnxruntime-osx-arm64

      - name: Build darwin/arm64
        env:
          ONNX_DEP_PREFIX: ${{ github.workspace }}/.deps/onnx/coreml
        run: |
          # Homebrew libxml2 is keg-only; expose its pkg-config so ONVIF is detected deterministically.
          LIBXML2_PREFIX="$(brew --prefix libxml2)"
          export PKG_CONFIG_PATH="${ONNX_DEP_PREFIX}/lib/pkgconfig:${LIBXML2_PREFIX}/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          export CMAKE_PREFIX_PATH="${ONNX_DEP_PREFIX}:${CMAKE_PREFIX_PATH:-}"
          meson setup build-darwin-arm64 \
            --default-library=static \
            --wrap-mode=default \
            --force-fallback-for=mbedtls,usrsctp \
            -DWITH_AV=true \
            -DONNX=enabled \
            -DONNX_STATIC=false \
            -DONNX_PROFILE=coreml \
            -DDEBUG=3 \
            -DNORIST=true \
            -DRELEASE=macOS_aarch64 \
            --prefix="$RUNNER_TEMP/darwin-arm64/mistserver-install"
          # Fail loudly if NDI/ONVIF support was not compiled in.
          grep -qE 'NDI:[[:space:]]+COMPILED' build-darwin-arm64/meson-logs/meson-log.txt || { echo "::error::NDI support was not compiled"; exit 1; }
          grep -qE 'ONVIF camera discovery:[[:space:]]+YES' build-darwin-arm64/meson-logs/meson-log.txt || { echo "::error::ONVIF support was not built"; exit 1; }
          grep -qE 'ONNX AI processing:[[:space:]]+YES \(profile=coreml\)' build-darwin-arm64/meson-logs/meson-log.txt || { echo "::error::ONNX CoreML support was not built"; exit 1; }
          ninja -C build-darwin-arm64 install
          scripts/ONNX/prepare_models.sh --dir "$RUNNER_TEMP/onnx-models" yolo26n
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i testsrc2=size=640x640 -frames:v 1 "$RUNNER_TEMP/onnx-test.jpg"
          scripts/ONNX/verify_release.sh --build-dir build-darwin-arm64 --allow-shared \
            --expected-profile coreml --provider coreml \
            --model "$RUNNER_TEMP/onnx-models/yolo26n.onnx" \
            --image "$RUNNER_TEMP/onnx-test.jpg"
          test -x "$RUNNER_TEMP/darwin-arm64/mistserver-install/bin/MistProcONNX"
          cp -a "$ONNX_DEP_PREFIX/lib/"*.dylib \
            "$RUNNER_TEMP/darwin-arm64/mistserver-install/lib/"
          # The official archive's unversioned linker file duplicates the 43 MiB runtime.
          # The executable loads the versioned install name, so do not ship the development copy.
          rm "$RUNNER_TEMP/darwin-arm64/mistserver-install/lib/libonnxruntime.dylib"
          install_name_tool -add_rpath '@executable_path/../lib' \
            "$RUNNER_TEMP/darwin-arm64/mistserver-install/bin/MistProcONNX"
          test -f "$RUNNER_TEMP/darwin-arm64/mistserver-install/lib/libonnxruntime.1.dylib"
          test -f "$RUNNER_TEMP/darwin-arm64/mistserver-install/lib/libopencv_core.dylib"
          capability=$("$RUNNER_TEMP/darwin-arm64/mistserver-install/bin/MistProcONNX" \
            -j 2>/dev/null || true)
          printf '%s' "$capability" | grep -F "This binary packages the 'coreml' profile"

      - name: Package darwin/arm64
        run: |
          cd "$RUNNER_TEMP/darwin-arm64/mistserver-install"
          mkdir -p share/mistserver/onnx share/licenses
          cp -a '${{ github.workspace }}/.deps/onnx/coreml/share/licenses/.' share/licenses/
          cp '${{ github.workspace }}/scripts/ONNX/prepare_models.sh' \
             '${{ github.workspace }}/scripts/ONNX/models.manifest.tsv' \
             '${{ github.workspace }}/scripts/ONNX/dependencies.lock.tsv' \
             '${{ github.workspace }}/scripts/ONNX/accelerator-images.json' \
             '${{ github.workspace }}/scripts/ONNX/RELEASE_CHECKLIST.md' \
             share/mistserver/onnx/
          jq \
            --arg version '${{ steps.version.outputs.tag }}' \
            --arg source_revision '${{ github.sha }}' \
            '.native_deployment as $deployment
             | first($deployment.targets[]
                 | select(.profile == "coreml" and .platform == "darwin/arm64")) as $target
             | if $target == null then error("CoreML target missing from deployment matrix")
               else {
                 schema: $deployment.schema,
                 artifact_kind: "mistserver-native-accelerator",
                 version: $version,
                 source_revision: $source_revision,
                 profile: $target.profile,
                 platform: $target.platform,
                 host: $deployment.platforms[$target.platform],
                 provider_runtime: $deployment.profiles[$target.profile],
                 install: {
                   requires_root: true,
                   copy: [
                     {source: "bin", destination: "/usr/local/bin"},
                     {source: "lib", destination: "/usr/local/lib"},
                     {source: "share", destination: "/usr/local/share"}
                   ],
                   loader_paths: $deployment.platforms[$target.platform].loader_paths
                 }
               }
             end' '${{ github.workspace }}/scripts/ONNX/accelerator-images.json' \
            > share/mistserver/onnx/deployment-contract.json
          for file in bin/Mist* lib/*.dylib \
                      lib/*/libmistonnx.dylib; do
            [ -e "$file" ] || continue
            printf '[%s]\n' "$file"
            otool -L "$file"
          done > share/mistserver/onnx/runtime-linkage.txt
          tar czf "${{ github.workspace }}/mistserver-darwin-arm64-${{ steps.version.outputs.tag }}.tar.gz" bin/ lib/ share/

      - name: Upload darwin/arm64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: mistserver-darwin-arm64
          path: mistserver-darwin-arm64-${{ steps.version.outputs.tag }}.tar.gz
          compression-level: 0

  # ---------------------------------------------------------------------------
  # Code signing + notarization for darwin binaries
  # ---------------------------------------------------------------------------
  sign-darwin:
    name: Sign and Notarize darwin Binaries
    needs: [build-binaries-darwin]
    if: startsWith(github.ref, 'refs/tags/') || inputs.sign_macos
    runs-on: macos-arm64-self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Add Homebrew to PATH
        run: echo "/opt/homebrew/bin" >> "$GITHUB_PATH"

      - name: Download darwin/arm64 artifact
        uses: actions/download-artifact@v8
        with:
          name: mistserver-darwin-arm64
          path: dist/

      - name: Extract darwin binaries
        run: |
          mkdir -p sign/darwin-arm64
          tar xzf dist/mistserver-darwin-arm64-*.tar.gz -C sign/darwin-arm64

      - name: Setup signing keychain
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: ./scripts/ci/setup-signing-keychain.sh

      - name: Sign darwin binaries
        run: |
          find sign/darwin-arm64/lib -type f -name '*.dylib' -print0 | while IFS= read -r -d '' lib; do
            codesign --sign "${{ secrets.APPLE_DEVELOPER_ID }}" \
              --timestamp --options runtime --force "$lib"
            echo "Signed: $lib"
          done
          for bin in sign/darwin-arm64/bin/Mist*; do
            [ -f "$bin" ] || continue
            codesign --sign "${{ secrets.APPLE_DEVELOPER_ID }}" \
              --timestamp --options runtime --force "$bin"
            echo "Signed: $bin"
          done

      - name: Verify signatures
        run: |
          find sign/darwin-arm64/lib -type f -name '*.dylib' -print0 | while IFS= read -r -d '' lib; do
            codesign --verify --verbose=2 "$lib"
          done
          for bin in sign/darwin-arm64/bin/Mist*; do
              [ -f "$bin" ] || continue
              codesign --verify --verbose=2 "$bin"
          done

      - name: Notarize darwin/arm64
        run: |
          cd sign/darwin-arm64
          zip -r ../../notarize-darwin-arm64.zip bin/ lib/ share/
          xcrun notarytool submit ../../notarize-darwin-arm64.zip \
            --apple-id "${{ secrets.APPLE_ID }}" \
            --team-id "${{ secrets.APPLE_TEAM_ID }}" \
            --password "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" \
            --wait

      - name: Get version info
        id: version
        run: |
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=development-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Re-package signed binaries
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          cd sign/darwin-arm64
          tar czf "${{ github.workspace }}/mistserver-darwin-arm64-${TAG}.tar.gz" bin/ lib/ share/

      - name: Upload signed darwin/arm64
        uses: actions/upload-artifact@v7
        with:
          name: mistserver-darwin-arm64-signed
          path: mistserver-darwin-arm64-*.tar.gz
          compression-level: 0

      - name: Clean up signing keychain
        if: always()
        run: ./scripts/ci/cleanup-signing-keychain.sh

  # ---------------------------------------------------------------------------
  # GitHub Release — assemble all artifacts
  # ---------------------------------------------------------------------------
  create-release:
    name: Create GitHub Release
    needs: [build-onnx-accelerators, create-manifest, build-binaries-amd64, build-binaries-arm64, build-binaries-darwin, sign-darwin]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download linux/amd64 binary
        uses: actions/download-artifact@v8
        with:
          name: mistserver-linux-amd64
          path: dist/

      - name: Download linux/arm64 binary
        uses: actions/download-artifact@v8
        with:
          name: mistserver-linux-arm64
          path: dist/

      - name: Download linux/amd64 debug symbols
        uses: actions/download-artifact@v8
        with:
          name: mistserver-linux-amd64-debug
          path: dist/

      - name: Download linux/arm64 debug symbols
        uses: actions/download-artifact@v8
        with:
          name: mistserver-linux-arm64-debug
          path: dist/

      - name: Download signed darwin/arm64 binary
        uses: actions/download-artifact@v8
        with:
          name: mistserver-darwin-arm64-signed
          path: dist/

      - name: Download Docker metadata
        uses: actions/download-artifact@v8
        with:
          name: docker-metadata
          path: dist/

      - name: Download linux/amd64 Docker metadata
        uses: actions/download-artifact@v8
        with:
          name: docker-metadata-amd64
          path: dist/

      - name: Download linux/arm64 Docker metadata
        uses: actions/download-artifact@v8
        with:
          name: docker-metadata-arm64
          path: dist/

      - name: Download ONNX accelerator image metadata
        uses: actions/download-artifact@v8
        with:
          pattern: onnx-accelerator-metadata-*
          path: dist/
          merge-multiple: true

      - name: Create release variant index
        run: |
          python3 scripts/ONNX/create_release_index.py \
            --dist dist \
            --matrix scripts/ONNX/accelerator-images.json \
            --release-tag '${{ github.ref_name }}' \
            --source-revision '${{ github.sha }}' \
            --output dist/mistserver-release-index.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MistServer ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*/*.tar.gz
            dist/*.txt
            dist/*/*.txt
            dist/mistserver-release-index.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
